name: Матчі дня DIDI

# Щоранку малює картинку «МАТЧІ ДНЯ» з розкладу ESPN і комітить її в matches/.
# n8n-процес «DIDI · матчі дня в канал» о 10:30 Київ публікує її в канал.
# Час у UTC: 07:35 і 08:05 UTC = 09:35 і 10:05 за Києвом (взимку).
on:
  schedule:
    - cron: '35 7 * * *'
    - cron: '5 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow
        run: pip install pillow

      - name: Вже намальовано?
        id: check
        run: |
          today=$(TZ=Europe/Kyiv date +%F)
          done=$(python3 -c "import json;print(json.load(open('matches/latest.json')).get('date',''))" 2>/dev/null || true)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "$done" = "$today" ]; then echo "todo=no" >> "$GITHUB_OUTPUT"; else echo "todo=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Малюємо
        if: steps.check.outputs.todo == 'yes'
        run: python3 matches.py "${{ steps.check.outputs.today }}"

      - name: Коміт
        if: steps.check.outputs.todo == 'yes'
        run: |
          git config user.name "DIDI cards bot"
          git config user.email "actions@users.noreply.github.com"
          find matches -name '*.jpg' -mtime +10 -delete || true
          git add matches
          git commit -m "Матчі дня ${{ steps.check.outputs.today }}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
